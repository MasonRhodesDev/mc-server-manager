## Local development — hot reload for backend (bun --hot) and frontend (Vite HMR)
## Usage: make dev

services:

  redis:
    image: redis:7-alpine
    container_name: mc-manager-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data

  backend:
    image: oven/bun:1
    container_name: mc-manager-backend
    working_dir: /app
    command: sh -c "bun install && bun run --hot src/index.ts"
    ports:
      - "3001:3000"
    environment:
      PORT: "3000"
      DB_PATH: /config/mc-manager.db
      DATA_PATH: /mnt/user/appdata/minecraft
      BACKUPS_PATH: /mnt/user/appdata/minecraft-backups
      JWT_SECRET: dev-secret-change-in-prod
      FRONTEND_URL: "http://localhost:5173"
      REDIS_URL: "redis://redis:6379"
    volumes:
      - ./backend:/app           # source mount — edits trigger --hot reload
      - /app/node_modules        # anonymous vol keeps container deps isolated
      - ./data:/config           # local bind mount — DB accessible at ./data/mc-manager.db
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    image: oven/bun:1
    container_name: mc-manager-frontend
    working_dir: /app
    command: sh -c "bun install && bun run dev -- --host"
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: "http://backend:3000"   # proxied by Vite to the backend service
    volumes:
      - ./frontend:/app          # source mount — edits trigger Vite HMR
      - /app/node_modules        # anonymous vol keeps container deps isolated
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis-data:
